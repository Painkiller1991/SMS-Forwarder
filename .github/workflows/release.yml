name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "Missing secret RELEASE_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/sms-forwarder-release.jks

      - name: Assemble release APK
        env:
          SMS_STORE_FILE: keystore/sms-forwarder-release.jks
          SMS_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SMS_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SMS_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Read version and validate manifest
        id: version
        run: |
          set -euo pipefail
          chmod +x gradlew
          VERSION_OUT="$(./gradlew -q printVersion)"
          VERSION_NAME="$(echo "$VERSION_OUT" | sed -n 's/^versionName=//p')"
          VERSION_CODE="$(echo "$VERSION_OUT" | sed -n 's/^versionCode=//p')"
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "Failed to read version from Gradle:"
            echo "$VERSION_OUT"
            exit 1
          fi

          MANIFEST_VERSION_NAME="$(python3 -c 'import json; print(json.load(open("update-manifest.json"))["versionName"])')"
          MANIFEST_VERSION_CODE="$(python3 -c 'import json; print(json.load(open("update-manifest.json"))["versionCode"])')"
          MANIFEST_APK_ASSET="$(python3 -c 'import json; print(json.load(open("update-manifest.json"))["apkAsset"])')"
          EXPECTED_APK="SMS-Forwarder-${VERSION_NAME}.apk"

          if [ "$MANIFEST_VERSION_NAME" != "$VERSION_NAME" ] || \
             [ "$MANIFEST_VERSION_CODE" != "$VERSION_CODE" ] || \
             [ "$MANIFEST_APK_ASSET" != "$EXPECTED_APK" ]; then
            echo "update-manifest.json does not match Gradle defaultConfig"
            echo "  Gradle: versionName=$VERSION_NAME versionCode=$VERSION_CODE apk=$EXPECTED_APK"
            echo "  Manifest: versionName=$MANIFEST_VERSION_NAME versionCode=$MANIFEST_VERSION_CODE apk=$MANIFEST_APK_ASSET"
            exit 1
          fi

          cp app/build/outputs/apk/release/app-release.apk "$EXPECTED_APK"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$EXPECTED_APK" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APK_PATH: ${{ steps.version.outputs.apk_path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump versionCode/versionName on develop before merging to main."
            exit 1
          fi
          NOTES="$(python3 -c 'import json; print("\n".join("- " + line for line in json.load(open("update-manifest.json")).get("changelog", [])))')"
          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION_NAME}"
          fi
          gh release create "$TAG" \
            "$APK_PATH" \
            update-manifest.json \
            --title "$TAG" \
            --notes "$NOTES"
